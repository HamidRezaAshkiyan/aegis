name: Build & Release Aegis

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: aegis-macos-arm64
            ext: tar.gz
            bin: aegis
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: aegis-macos-x86_64
            ext: tar.gz
            bin: aegis
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: aegis-windows-x86_64
            ext: zip
            bin: aegis.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests (native targets)
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin aegis

      - name: Package macOS archive & DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/pkg
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/pkg/
          cp README.md LICENSE dist/pkg/
          tar -czf dist/${{ matrix.asset_name }}.tar.gz -C dist/pkg .
          ARCH_LABEL="${{ matrix.asset_name }}"
          ARCH_LABEL="${ARCH_LABEL#aegis-macos-}"
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$ARCH_LABEL" "dist/Aegis-macos-${ARCH_LABEL}.dmg"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/pkg | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin }} dist/pkg/
          Copy-Item README.md, LICENSE dist/pkg/
          Compress-Archive -Path dist/pkg/* -DestinationPath dist/${{ matrix.asset_name }}.zip -Force

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="dist/${{ matrix.asset_name }}.${{ matrix.ext }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Aegis $TAG" --generate-notes || true
          fi
          gh release upload "$TAG" "$ASSET" --clobber
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ARCH_LABEL="${{ matrix.asset_name }}"
            ARCH_LABEL="${ARCH_LABEL#aegis-macos-}"
            gh release upload "$TAG" "dist/Aegis-macos-${ARCH_LABEL}.dmg" --clobber
          fi
