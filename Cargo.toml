[workspace]
resolver = "2"
members = [
    "crates/core-engine",
    "crates/core-stats",
    "crates/core-dns",
    "crates/core-proxy",
    "crates/core-os",
    "crates/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Aegis: Lightweight, open-source, system-wide ad & tracker blocker for Windows and macOS"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "deflate"] }
hickory-proto = "0.24"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
base64 = "0.22"
directories = "5"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
